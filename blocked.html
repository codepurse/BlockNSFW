<!doctype html>
<html lang="en" class="theme-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page held · BlockNSFW</title>
  <script src="ui/scheme.js"></script>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <style>
    /* The held page: paper, one centred column, the first line says what
       happened. People often arrive here at a low moment, so it is calm and
       says nothing about them. Classic is this document as written; the other
       designs restyle it through html[data-theme] (blocked-themes.css). */

    /* Hidden until the saved design is applied, so a design never flashes in
       over Classic. If script never runs, the page shows itself after 0.6s. */
    html.theme-pending body {
      visibility: hidden;
      animation: theme-reveal 0s linear 0.6s forwards;
    }
    @keyframes theme-reveal {
      to { visibility: visible; }
    }
    @media (prefers-reduced-motion: reduce) {
      html.theme-pending body {
        animation-delay: 0.6s !important;
      }
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      padding: clamp(48px, 16vh, 160px) var(--space-4) var(--space-6);
    }

    .container {
      width: 100%;
      max-width: 32rem;
      margin: 0 auto;
    }

    /* Classic stands in the field, as monolab.dev's title page does: the
       marks come down over the top of the screen, and the words sit in the
       clearing below the layer where they are decided. The other designs
       draw their own picture, so they leave it out. */
    html:not([data-theme]) body {
      padding-top: clamp(96px, 30vh, 280px);
    }
    html:not([data-theme]) .blocked-header,
    html:not([data-theme]) .support,
    html:not([data-theme]) .blocked-foot {
      text-align: center;
    }
    html:not([data-theme]) .blocked-subtitle {
      margin-inline: auto;
    }
    html:not([data-theme]) .blocked-actions {
      justify-content: center;
    }
    html[data-theme] .field-art {
      display: none;
    }

    /* The held mark: pale pine, the Held icon, the word in pine. It wipes
       down once as the page appears. */
    .held-plate {
      gap: var(--space-2);
      padding: 6px var(--space-3) 6px 10px;
    }
    html:not(.theme-pending) .held-plate {
      animation: held-wipe var(--dur-held) var(--ease-out-quint) backwards;
    }
    @keyframes held-wipe {
      from { clip-path: inset(0 0 100% 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    .blocked-title {
      margin-top: var(--space-5);
    }
    .blocked-subtitle {
      margin-top: var(--space-3);
      max-width: 28rem;
      font-size: 16px;
      color: var(--color-ink-2);
    }

    .blocked-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-6);
    }

    /* Why, as a few hairline records. */
    .why {
      margin-top: var(--space-7);
      border-top: 1px solid var(--color-rule);
    }
    .why > summary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) 0;
      list-style: none;
      cursor: pointer;
    }
    .why > summary::-webkit-details-marker {
      display: none;
    }
    .why > summary:hover {
      color: var(--color-ink-2);
    }
    .why > summary .icon {
      transition: transform var(--dur-state) var(--ease-in-out-quart);
    }
    .why:not([open]) > summary .icon {
      transform: rotate(-90deg);
    }
    .why-rows {
      border-top: 1px solid var(--color-rule);
    }
    .why-rows .record + .record {
      border-top: 1px solid var(--color-rule);
    }
    .why-rows dd {
      margin: 0;
    }
    .blocked-url {
      letter-spacing: 0.04em;
    }
    .why-value {
      font-size: 14px;
      text-align: right;
    }
    .blocked-message {
      padding: var(--space-3) 0;
      border-top: 1px solid var(--color-rule);
      font-size: 14px;
      color: var(--color-ink-2);
    }

    .support {
      margin-top: var(--space-6);
      font-size: 14px;
      color: var(--color-ink-2);
    }
    .support-title {
      color: var(--color-ink);
      font-weight: 500;
    }

    .blocked-foot {
      margin-top: var(--space-7);
    }
  </style>
  <link rel="stylesheet" href="blocked-themes.css" />
</head>
<body>
  <div class="field-art" aria-hidden="true">
    <img class="field-still field-still-light" src="ui/field-still.svg" alt="" />
    <img class="field-still field-still-dark" src="ui/field-still-dark.svg" alt="" />
  </div>
  <main class="container">
    <section class="theme-hero" id="theme-hero" hidden></section>
    <div class="blocked-card">
      <header class="blocked-header">
        <p class="held held-plate">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 10.5h12" stroke-width="1.5" /><path d="M8 2v5.5" /><path d="M5.5 5.5L8 7.75 10.5 5.5" /></svg>
          <span class="held-word">held</span>
        </p>
        <h1 class="title title-held blocked-title">This page was held.</h1>
        <p class="blocked-subtitle">BlockNSFW stopped it before it loaded.</p>
      </header>

      <div class="blocked-actions">
        <button type="button" class="btn btn-primary" id="back-button">Go back</button>
        <a class="btn btn-ghost" id="settings" href="#">Settings</a>
      </div>

      <details class="why" id="why" open>
        <summary class="meta">
          <svg class="icon icon-12" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 6l4 4 4-4" /></svg>
          Why this page was held
        </summary>
        <div class="blocked-content">
          <dl class="why-rows" id="why-rows">
            <div class="record">
              <dt class="meta blocked-url-label">address</dt>
              <dd class="record-value blocked-url" id="target-url">••••••••</dd>
            </div>
          </dl>
          <p class="blocked-message">It matched your protection settings.</p>
        </div>
      </details>

      <p class="support">
        <span class="support-title">Having a hard moment?</span>
        <a class="link support-cta" href="community.html">Read how others got through it</a>
      </p>
    </div>
    <footer class="meta blocked-foot">BlockNSFW · monolab</footer>
  </main>

  <script src="blocked-themes.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
